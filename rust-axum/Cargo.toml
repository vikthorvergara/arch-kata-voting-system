[package]
name = "voting-axum"
version = "1.0.0"
edition = "2021"

[dependencies]
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.37", features = ["full"] }
tower = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
