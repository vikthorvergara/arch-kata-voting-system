services:
  openmetadata-mysql:
    image: mysql:8.2
    environment:
      MYSQL_ROOT_PASSWORD: openmetadata
      MYSQL_DATABASE: openmetadata_db
      MYSQL_USER: openmetadata
      MYSQL_PASSWORD: openmetadata
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-popenmetadata"]
      interval: 5s
      timeout: 5s
      retries: 10

  openmetadata-elasticsearch:
    image: elasticsearch:7.17.16
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms256m -Xmx256m"
    ports:
      - "9201:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  openmetadata-server:
    image: openmetadata/server:1.3.1
    depends_on:
      openmetadata-mysql:
        condition: service_healthy
      openmetadata-elasticsearch:
        condition: service_healthy
    environment:
      OPENMETADATA_CLUSTER_NAME: openmetadata
      DB_DRIVER_CLASS: com.mysql.cj.jdbc.Driver
      DB_SCHEME: mysql
      DB_HOST: openmetadata-mysql
      DB_PORT: 3306
      DB_USER: openmetadata
      DB_USER_PASSWORD: openmetadata
      DB_NAME: openmetadata_db
      SEARCH_TYPE: elasticsearch
      ELASTICSEARCH_HOST: openmetadata-elasticsearch
      ELASTICSEARCH_PORT: 9200
      ELASTICSEARCH_SCHEME: http
      SERVER_HOST_API_URL: http://localhost:8585/api
      AUTHENTICATION_PROVIDER: no-auth
      AUTHORIZER_ENABLE_SECURE_SOCKET: "false"
    ports:
      - "8585:8585"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8585/api/v1/system/version || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
